  <style id="noc-mobile-sidebar-final">
    @media screen and (max-width: 980px) {
      #sidebar.sidebar {
        position: fixed !important;
        top: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        right: auto !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch !important;
        z-index: 1002 !important;
        box-sizing: border-box !important;
      }
      #sidebar.sidebar:not(.open) {
        transform: translate3d(-105%,0,0) !important;
      }
      #sidebar.sidebar.open {
        transform: translate3d(0,0,0) !important;
      }
      #sidebar #mainNav,
      #sidebar .nav-item {
        width: 100% !important;
        max-width: none !important;
        box-sizing: border-box !important;
      }
      #sidebar .nav-item {
        white-space: normal !important;
        overflow: visible !important;
        text-overflow: clip !important;
      }
    }
    @media screen and (max-width: 980px) and (orientation: portrait) {
      #sidebar.sidebar {
        width: calc(100vw - 18px) !important;
        min-width: calc(100vw - 18px) !important;
        max-width: calc(100vw - 18px) !important;
      }
    }
    @media screen and (max-width: 980px) and (orientation: landscape) {
      #sidebar.sidebar {
        width: min(52vw, 360px) !important;
      }
    }
  </style>


  <link rel="icon" type="image/png" sizes="32x32" href="noc-skull-tab-32-v350.png?v=3.9.9">
  <link rel="icon" type="image/png" sizes="16x16" href="noc-skull-tab-16-v350.png?v=3.9.9">

  <link rel="apple-touch-icon" sizes="180x180" href="noc-icon-iphone-v400.png">

  <style id="noc-brand-v412">
    #sidebar .brand { display:flex; align-items:center; gap:10px; }
    #sidebar .brand .brand-mark { flex:0 0 auto; }
    #sidebar .brand .brand-copy { display:flex; align-items:center; min-height:100%; }
    #sidebar .brand .brand-copy strong { display:block; margin:0; line-height:1.28; }
  </style>

  <style id="noc-factura-checkbox-v413">
    /* V4.0.13 — checkbox Facturas idéntico a Proformas */
    body.noc-fashion-ui .noc-facturas-modern input.modern-check,
    body.noc-fashion-ui .noc-facturas-modern thead input.modern-check,
    body.noc-fashion-ui .noc-facturas-modern tbody input.modern-check {
      appearance: none !important;
      -webkit-appearance: none !important;
      display: inline-block !important;
      box-sizing: border-box !important;
      width: 16px !important;
      min-width: 16px !important;
      max-width: 16px !important;
      height: 16px !important;
      min-height: 16px !important;
      max-height: 16px !important;
      padding: 0 !important;
      margin: 0 !important;
      border: 1px solid #c9cdd2 !important;
      border-radius: 3px !important;
      background: #fff !important;
      box-shadow: none !important;
      vertical-align: middle !important;
      cursor: pointer !important;
    }
    body.noc-fashion-ui .noc-facturas-modern input.modern-check:checked {
      background: #111 !important;
      border-color: #111 !important;
      box-shadow: inset 0 0 0 3px #fff !important;
    }
    body.noc-fashion-ui .noc-facturas-modern .modern-check-col {
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding-left: 18px !important;
      padding-right: 8px !important;
      text-align: center !important;
    }
  </style>

</head>
<body class="noc-fashion-ui">
<div id="authGate" class="auth-gate">
  <div class="login-card">
    <div class="login-brand login-logo"><img src="assets/logo-noc-skull.png?v=3.4.6" alt="NOC"></div>
    <h1>Gestión NOC</h1>
    <p class="muted">Acceso privado</p>
    <form id="loginForm" class="login-form">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button id="loginButton" class="btn btn-primary" type="submit">Entrar</button>
      <div id="loginError" class="login-error" aria-live="polite"></div>
    </form>
  </div>
</div>

<div id="appShell" style="display:none">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark brand-logo"><img src="assets/logo-noc-skull.png?v=3.4.6" alt="NOC"></div>
      <div class="brand-copy"><strong>Gestión<br>NOC</strong></div>
    </div>
    <nav id="mainNav">
      <button class="nav-item active" data-view="dashboard">Inicio</button>
      <button class="nav-item" data-view="clientes">Clientes</button>
      <button class="nav-item" data-view="articulos">Artículos</button>
      <button class="nav-item" data-view="proformas">Proformas</button>
      <button class="nav-item" data-view="facturas">Facturas</button>
      <button class="nav-item" data-view="gastos">Gastos</button>
      <button class="nav-item" data-view="informes">Informes</button>
      <button class="nav-item" data-view="empresa">Empresa</button>
      <button class="nav-item" data-view="configuracion">Tipos de envío</button>
      <button class="nav-item" data-view="herramientas">Herramientas</button>
    </nav>
    <div class="sidebar-footer">
      <span id="connectionDot" class="status-dot"></span>
      <span id="connectionText">Conectando…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn mobile-only">☰</button>
      <div>
        <h1 id="pageTitle">Inicio</h1>
        <p id="pageSubtitle">Resumen general</p>
      </div>
      <div class="top-actions">
        <span id="sessionUser" class="save-status"></span>
        <button id="logoutBtn" class="btn btn-small" type="button" onclick="NOC.Auth.signOut()" style="display:none">Cerrar sesión</button>
        <button class="btn btn-primary" onclick="NOC.App.openNewProforma()">+ Nueva proforma</button>
      </div>
    </header>
    <section id="viewContainer" class="view-container"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
</body>
</html>
