<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestión NOC</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./noc-safari-icon-351.png">
  <link rel="shortcut icon" href="./noc-safari-icon-351.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./noc-safari-touch-351.png">

  <link rel="manifest" href="./noc-manifest-v350.webmanifest">
  <meta name="theme-color" content="#111318">


  <link rel="stylesheet" href="css/styles.css?v=3.4.6">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="modules/dashboard.js"></script>
  <script defer src="modules/clientes.js"></script>
  <script defer src="modules/articulos.js"></script>
  <script defer src="modules/documentos.js?v=3.4.2"></script>
  <script defer src="modules/proformas.js?v=3.5.1"></script>
  <script defer src="modules/facturas.js"></script>
  <script defer src="modules/gastos.js"></script>
  <script defer src="modules/informes.js?v=3.4.5"></script>
  <script defer src="modules/empresa.js"></script>
  <script defer src="modules/configuracion.js"></script>
  <script defer src="modules/herramientas.js?v=3.4.3"></script>
  <script defer src="js/app.js?v=3.5.0"></script>
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="login-card">
    <div class="login-brand login-logo"><img src="assets/logo-noc-skull.png?v=3.4.6" alt="NOC"></div>
    <h1>Gestión NOC</h1>
    <p class="muted">Acceso privado</p>
    <form id="loginForm" class="login-form">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button id="loginButton" class="btn btn-primary" type="submit">Entrar</button>
      <div id="loginError" class="login-error" aria-live="polite"></div>
    </form>
  </div>
</div>

<div id="appShell" style="display:none">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark brand-logo"><img src="assets/logo-noc-skull.png?v=3.4.6" alt="NOC"></div>
      <div><strong>Gestión NOC</strong><small>V3</small></div>
    </div>
    <nav id="mainNav">
      <button class="nav-item active" data-view="dashboard">Inicio</button>
      <button class="nav-item" data-view="clientes">Clientes</button>
      <button class="nav-item" data-view="articulos">Artículos</button>
      <button class="nav-item" data-view="proformas">Proformas</button>
      <button class="nav-item" data-view="facturas">Facturas</button>
      <button class="nav-item" data-view="gastos">Gastos</button>
      <button class="nav-item" data-view="informes">Informes</button>
      <button class="nav-item" data-view="empresa">Empresa</button>
      <button class="nav-item" data-view="configuracion">Tipos de envío</button>
      <button class="nav-item" data-view="herramientas">Herramientas</button>
    </nav>
    <div class="sidebar-footer">
      <span id="connectionDot" class="status-dot"></span>
      <span id="connectionText">Conectando…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn mobile-only">☰</button>
      <div>
        <h1 id="pageTitle">Inicio</h1>
        <p id="pageSubtitle">Resumen general</p>
      </div>
      <div class="top-actions">
        <span id="sessionUser" class="save-status"></span>
        <button id="logoutBtn" class="btn btn-small" type="button" onclick="NOC.Auth.signOut()" style="display:none">Cerrar sesión</button>
        <button class="btn btn-primary" onclick="NOC.App.openNewProforma()">+ Nueva proforma</button>
      </div>
    </header>
    <section id="viewContainer" class="view-container"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
</body>
</html>
